name: Feature request
description: Suggest an improvement to Dosser.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Explain who needs this and what they currently struggle to do.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the outcome you want and any alternatives you considered.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context and tradeoffs
      description: Include relevant formats, browser requirements, quality expectations, or privacy implications. Avoid private documents and sensitive data.
